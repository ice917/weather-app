<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0ea5e9" id="themeColor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>实时天气</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg-gradient-start: #e0f2fe;
            --bg-gradient-end: #f0f9ff;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(255, 255, 255, 0.5);
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-light: #94a3b8;
            --shadow: 0 10px 40px -10px rgba(14, 165, 233, 0.25);
            --radius: 24px;
            --aqi-good: #22c55e;
            --aqi-moderate: #eab308;
            --aqi-unhealthy: #f97316;
            --aqi-bad: #ef4444;
            --aqi-severe: #a855f7;
            --aqi-hazardous: #7f1d1d;
        }

        [data-theme="dark"] {
            --primary: #38bdf8;
            --primary-dark: #0ea5e9;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(30, 41, 59, 0.5);
            --text-main: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-light: #64748b;
            --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 14px 48px;
            transition: background 0.3s ease, color 0.3s ease;
            overscroll-behavior-y: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            touch-action: pan-y;
        }

        /* ===== Install Banner ===== */
        .install-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 14px;
            animation: fadeInDown 0.4s ease;
        }

        .install-banner.show { display: flex; }

        .install-btn {
            background: #fff;
            color: var(--primary-dark);
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .install-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 18px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* ===== Header ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .top-bar h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(14,165,233,0.15);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
        }

        .icon-btn:hover { transform: scale(1.05); background: var(--card-bg); }

        /* ===== Search ===== */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input-wrap {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 44px 14px 18px;
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        .search-input::placeholder { color: var(--text-light); }

        .locate-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-suggest {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 260px;
            overflow-y: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
            padding: 6px;
        }

        .search-suggest.show { display: block; animation: fadeInUp 0.2s ease; }

        .suggest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-main);
            transition: background 0.15s;
        }

        .suggest-item:hover, .suggest-item.active {
            background: var(--card-bg);
        }

        .suggest-item .suggest-city { font-weight: 500; }
        .suggest-item .suggest-tag {
            font-size: 11px;
            color: var(--text-light);
            background: rgba(14,165,233,0.08);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .suggest-empty {
            padding: 14px;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .search-btn {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(14,165,233,0.3); }
        .search-btn:active { transform: translateY(0); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ===== Tags ===== */
        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            min-height: 0;
        }

        .tag {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag:hover, .tag.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tag-title {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 6px;
            width: 100%;
        }

        /* ===== Status ===== */
        .status {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        .status.show { display: flex; }
        .status.info { background: rgba(14,165,233,0.1); color: var(--primary-dark); border: 1px solid rgba(14,165,233,0.15); }
        .status.error { background: rgba(239,68,68,0.08); color: #dc2626; border: 1px solid rgba(239,68,68,0.15); }
        .status.offline { background: rgba(245,158,11,0.08); color: #d97706; border: 1px solid rgba(245,158,11,0.15); }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(14,165,233,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Cards ===== */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .card.show { display: block; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .city-info h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .city-info .date-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .fav-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .fav-btn.active { color: #ef4444; }
        .fav-btn:hover { transform: scale(1.1); }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .temp-block { display: flex; align-items: flex-start; }
        .temp-value { font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
        .temp-unit { font-size: 24px; font-weight: 400; margin-top: 6px; color: var(--text-secondary); }

        .weather-icon-wrap {
            width: 90px; height: 90px; flex-shrink: 0;
        }

        .weather-icon-wrap svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
            animation: float 3s ease-in-out infinite;
        }

        .weather-desc-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: -4px;
            margin-bottom: 18px;
        }

        /* ===== Grids ===== */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            transition: transform 0.2s;
        }

        .detail-item:hover { transform: translateY(-2px); }

        .detail-icon {
            width: 22px; height: 22px;
            margin: 0 auto 6px;
            color: var(--primary);
        }

        .detail-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
        .detail-value { font-size: 15px; font-weight: 600; color: var(--text-main); }

        .env-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 560px) {
            .env-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .env-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
        }

        .env-icon { width: 22px; height: 22px; margin: 0 auto 6px; color: var(--primary); }
        .env-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
        .env-value { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .env-sub { font-size: 11px; color: var(--text-light); margin-top: 2px; }

        /* ===== Hourly ===== */
        .hourly-chart-wrap {
            position: relative;
            height: 120px;
            margin-bottom: 12px;
        }

        .hourly-chart-wrap svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .hourly-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .hourly-list::-webkit-scrollbar { display: none; }

        .hourly-item {
            flex: 0 0 52px;
            text-align: center;
        }

        .hourly-time { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
        .hourly-icon { width: 28px; height: 28px; margin: 0 auto 4px; }
        .hourly-icon svg { width: 100%; height: 100%; }
        .hourly-temp { font-size: 13px; font-weight: 600; color: var(--text-main); }

        /* ===== Daily ===== */
        .daily-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .daily-list::-webkit-scrollbar { display: none; }

        .daily-card {
            flex: 0 0 88px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 14px 8px;
            text-align: center;
            transition: transform 0.2s;
        }

        .daily-card:hover { transform: translateY(-3px); }

        .daily-date { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        .daily-icon { width: 36px; height: 36px; margin: 0 auto 6px; }
        .daily-icon svg { width: 100%; height: 100%; }
        .daily-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .daily-temp-high { font-size: 15px; font-weight: 700; color: var(--primary-dark); }
        .daily-temp-low { font-size: 12px; color: var(--text-light); }

        /* ===== Section Title ===== */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .swipe-hint {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 400;
        }

        /* ===== Animations ===== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* ===== Responsive ===== */
        @media (max-width: 560px) {
            .temp-value { font-size: 56px; }
            .detail-grid { grid-template-columns: repeat(2, 1fr); }
            .weather-main { justify-content: center; text-align: center; }
            .card-header { flex-direction: column; gap: 6px; }
            .search-box { flex-direction: column; }
            .search-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="swipeArea">
    <div class="install-banner" id="installBanner">
        <span>添加到手机桌面，像 App 一样使用</span>
        <div>
            <button class="install-btn" id="installBtn">添加</button>
            <button class="install-close" onclick="dismissInstall()">&times;</button>
        </div>
    </div>

    <div class="top-bar">
        <h1>实时天气</h1>
        <div class="top-actions">
            <button class="icon-btn" id="locateToggleBtn" onclick="toggleLocateSetting()" title="自动定位">
                <span id="locateToggleIcon">📍</span>
            </button>
            <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <div class="search-box">
        <div class="search-input-wrap">
            <input type="text" class="search-input" id="cityInput" placeholder="请输入城市名称，如：北京、上海、New York..." autocomplete="off">
            <button class="locate-btn" id="locateBtn" onclick="handleAutoLocate(true)" title="定位当前位置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            </button>
            <div class="search-suggest" id="searchSuggest"></div>
        </div>
        <button class="search-btn" id="searchBtn" onclick="handleSearch()">查询</button>
    </div>

    <div class="tag-row" id="historyRow" style="display:none;"></div>
    <div class="tag-row" id="savedRow" style="display:none;"></div>

    <div class="status info" id="loadingStatus">
        <div class="spinner"></div>
        <span>正在查询天气数据，请稍候...</span>
    </div>
    <div class="status error" id="errorStatus"></div>
    <div class="status offline" id="offlineStatus">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <span>网络已断开，请检查网络连接后重试</span>
    </div>

    <!-- Current Weather -->
    <div class="card" id="weatherCard">
        <div class="card-header">
            <div class="city-info">
                <h2 id="cityName">--</h2>
                <div class="date-text" id="dateText">--</div>
            </div>
            <button class="fav-btn" id="favBtn" onclick="toggleFavorite()" title="收藏">
                <span id="favIcon">♡</span>
            </button>
        </div>

        <div class="weather-main">
            <div class="temp-block">
                <span class="temp-value" id="tempValue">--</span>
                <span class="temp-unit">°C</span>
            </div>
            <div class="weather-icon-wrap" id="iconWrap"></div>
        </div>

        <div class="weather-desc-text" id="weatherDesc">--</div>

        <div class="detail-grid">
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
                <div class="detail-label">相对湿度</div>
                <div class="detail-value" id="humidity">--%</div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></div>
                <div class="detail-label">风向风力</div>
                <div class="detail-value" id="wind">--</div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></div>
                <div class="detail-label">体感温度</div>
                <div class="detail-value" id="feelsLike">--°C</div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <div class="detail-label">更新时间</div>
                <div class="detail-value" id="updateTime">--</div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></div>
                <div class="detail-label">最高气温</div>
                <div class="detail-value" id="tempMax">--°C</div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
                <div class="detail-label">最低气温</div>
                <div class="detail-value" id="tempMin">--°C</div>
            </div>
        </div>
    </div>

    <!-- Environment -->
    <div class="card" id="envCard">
        <div class="section-title">环境数据</div>
        <div class="env-grid">
            <div class="env-item">
                <div class="env-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6H4zM4 4h6v6H4zM14 14h6v6h-6zM14 4h6v6h-6z"/></svg></div>
                <div class="env-label">AQI 指数</div>
                <div class="env-value" id="aqiValue">--</div>
                <div class="env-sub" id="aqiLabel">--</div>

let suggestActive = -1;
let suggestMatches = [];

function getCityMatches(query) {
    const q = query.trim();
    if (!q) return [];
    const isEn = /^[a-zA-Z]+$/.test(q);
    const lowerQ = q.toLowerCase();
    let matches = [];

    if (isEn) {
        matches = CITY_DB.filter(c => c.p.startsWith(lowerQ));
    } else {
        matches = CITY_DB.filter(c => c.n.startsWith(q));
    }

    // Boost by history frequency
    const hist = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    matches.sort((a, b) => {
        const ia = hist.indexOf(a.n);
        const ib = hist.indexOf(b.n);
        if (ia >= 0 && ib < 0) return -1;
        if (ib >= 0 && ia < 0) return 1;
        if (ia >= 0 && ib >= 0) return ia - ib;
        return a.n.length - b.n.length;
    });

    return matches.slice(0, 8);
}

function renderSuggest(matches) {
    const box = document.getElementById('searchSuggest');
    if (!matches.length) {
        box.innerHTML = '<div class="suggest-empty">无匹配城市，尝试输入拼音首字母</div>';
        box.classList.add('show');
        return;
    }
    suggestMatches = matches;
    suggestActive = -1;
    box.innerHTML = matches.map((c, i) => `
        <div class="suggest-item" data-index="${i}" data-city="${c.n}" onclick="selectSuggest('${c.n}')">
            <span class="suggest-city">${c.n}</span>
            <span class="suggest-tag">${c.p.toUpperCase()}</span>
        </div>
    `).join('');
    box.classList.add('show');
}

function selectSuggest(city) {
    document.getElementById('cityInput').value = city;
    hideSuggest();
    quickSearch(city);
}

function hideSuggest() {
    document.getElementById('searchSuggest').classList.remove('show');
    suggestActive = -1;
    suggestMatches = [];
}

function updateSuggestHighlight() {
    document.querySelectorAll('.suggest-item').forEach((el, i) => {
        el.classList.toggle('active', i === suggestActive);
    });
}

document.addEventListener('click', e => {
    if (!e.target.closest('.search-input-wrap')) hideSuggest();
});

/* ==================== Locate Setting ==================== */
function initLocateSetting() {
    const enabled = localStorage.getItem('autoLocate') !== 'false';
    updateLocateToggleUI(enabled);
}

function updateLocateToggleUI(enabled) {
    const btn = document.getElementById('locateToggleBtn');
    const icon = document.getElementById('locateToggleIcon');
    if (!btn || !icon) return;
    if (enabled) {
        icon.textContent = '📍';
        btn.style.opacity = '1';
        btn.title = '自动定位：开启（点击关闭）';
    } else {
        icon.textContent = '📍';
        btn.style.opacity = '0.4';
        btn.title = '自动定位：关闭（点击开启）';
    }
}

function toggleLocateSetting() {
    const enabled = localStorage.getItem('autoLocate') !== 'false';
    const newVal = !enabled;
    localStorage.setItem('autoLocate', String(newVal));
    updateLocateToggleUI(newVal);
    if (newVal) {
        handleAutoLocate();
    }
}

function isAutoLocateEnabled() {
    return localStorage.getItem('autoLocate') !== 'false';
}

/* ==================== Theme ==================== */
function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    setTheme(isDark);
}

function setTheme(isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('themeColor').setAttribute('content', isDark ? '#0f172a' : '#0ea5e9');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    setTheme(!isDark);
}

initTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('theme')) setTheme(e.matches);
});

/* ==================== PWA Install ==================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('installDismissed')) {
        document.getElementById('installBanner').classList.add('show');
    }
});

document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
});

function dismissInstall() {
    document.getElementById('installBanner').classList.remove('show');
    localStorage.setItem('installDismissed', '1');
}

/* ==================== Helpers ==================== */
function formatDate(dateStr) {
    const d = new Date(dateStr);
    const month = d.getMonth() + 1;
    const day = d.getDate();
    const week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    return `${month}/${day} ${week}`;
}

function formatShortDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getMonth() + 1}/${d.getDate()}`;
}

function formatTime(date) {
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
}

function formatHour(isoStr) {
    const d = new Date(isoStr);
    return `${String(d.getHours()).padStart(2,'0')}:00`;
}

function getWindDir(deg) {
    const dirs = ['北','东北','东','东南','南','西南','西','西北'];
    return dirs[Math.round(deg / 45) % 8] + '风';
}

function getWindLevel(speedKmh) {
    if (speedKmh < 1) return '0级';
    if (speedKmh < 6) return '1级';
    if (speedKmh < 12) return '2级';
    if (speedKmh < 20) return '3级';
    if (speedKmh < 29) return '4级';
    if (speedKmh < 39) return '5级';
    if (speedKmh < 50) return '6级';
    if (speedKmh < 62) return '7级';
    return '8级+';
}

function getAQIColor(aqi) {
    if (aqi <= 20) return 'var(--aqi-good)';
    if (aqi <= 40) return 'var(--aqi-moderate)';
    if (aqi <= 60) return 'var(--aqi-unhealthy)';
    if (aqi <= 80) return 'var(--aqi-bad)';
    if (aqi <= 100) return 'var(--aqi-severe)';
    return 'var(--aqi-hazardous)';
}

function getAQILabel(aqi) {
    if (aqi <= 20) return '优';
    if (aqi <= 40) return '良';
    if (aqi <= 60) return '轻度污染';
    if (aqi <= 80) return '中度污染';
    if (aqi <= 100) return '重度污染';
    return '严重污染';
}

function getUVLabel(uv) {
    if (uv <= 2) return '低';
    if (uv <= 5) return '中等';
    if (uv <= 7) return '高';
    if (uv <= 10) return '很高';
    return '极高';
}

let savedCities = [];
let searchHistory = [];
let touchStartX = 0;

const els = {
    cityInput: document.getElementById('cityInput'),
    searchBtn: document.getElementById('searchBtn'),
    locateBtn: document.getElementById('locateBtn'),
    loading: document.getElementById('loadingStatus'),
    error: document.getElementById('errorStatus'),

    savedRow: document.getElementById('savedRow'),
    favBtn: document.getElementById('favBtn'),

};

function showStatus(type, msg) {
    els.loading.classList.remove('show');
    els.error.classList.remove('show');
    els.offline.classList.remove('show');
    if (type === 'loading') els.loading.classList.add('show');
    if (type === 'error') { els.error.textContent = msg; els.error.classList.add('show'); }
    if (type === 'offline') els.offline.classList.add('show');
}

function hideAllStatus() {
    els.loading.classList.remove('show');
    els.error.classList.remove('show');
    els.offline.classList.remove('show');
}

/* ==================== Network ==================== */
function updateOnlineStatus() {
    if (!navigator.onLine) showStatus('offline');
    else els.offline.classList.remove('show');
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

/* ==================== Storage ==================== */
function loadSavedCities() {
    try { savedCities = JSON.parse(localStorage.getItem('savedCities')) || []; } catch { savedCities = []; }
    renderSavedCities();
}

function loadHistory() {
    try { searchHistory = JSON.parse(localStorage.getItem('searchHistory')) || []; } catch { searchHistory = []; }
    renderHistory();
}

function saveCities() {
    localStorage.setItem('savedCities', JSON.stringify(savedCities));
    renderSavedCities();
}

function addToHistory(name) {
    searchHistory = searchHistory.filter(n => n !== name);
    searchHistory.unshift(name);
    if (searchHistory.length > 8) searchHistory.pop();
    localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
    renderHistory();
}

function renderSavedCities() {
    const row = els.savedRow;
    if (!savedCities.length) { row.style.display = 'none'; return; }
    row.style.display = 'flex';
    row.innerHTML = '<div class="tag-title">收藏城市</div>' +
        savedCities.map((c, i) => {
            const isActive = currentCity && c.name === currentCity.name;
            return `<div class="tag ${isActive ? 'active' : ''}" onclick="loadSavedCity(${i})">${c.name}</div>`;
        }).join('');
}

function renderHistory() {
    const row = els.historyRow;
    if (!searchHistory.length) { row.style.display = 'none'; return; }
    row.style.display = 'flex';
    row.innerHTML = '<div class="tag-title">最近搜索</div>' +
        searchHistory.map(name => `<div class="tag" onclick="quickSearch('${name}')">${name}</div>`).join('');
}

function quickSearch(name) {
    els.cityInput.value = name;
    handleSearch();
}

function loadSavedCity(index) {
    const c = savedCities[index];
    if (!c) return;
    currentCity = c;
    fetchAll(c.lat, c.lon, c.name, c.country);
}

function toggleFavorite() {
    if (!currentCity) return;
    const idx = savedCities.findIndex(c => c.name === currentCity.name && c.lat === currentCity.lat);
    if (idx >= 0) {
        savedCities.splice(idx, 1);
        els.favIcon.textContent = '♡';
        els.favBtn.classList.remove('active');
    } else {
        savedCities.push({ ...currentCity });
        els.favIcon.textContent = '♥';
        els.favBtn.classList.add('active');
    }
    saveCities();
}

function updateFavBtn() {
    if (!currentCity) return;
    const isFav = savedCities.some(c => c.name === currentCity.name && c.lat === currentCity.lat);
    els.favIcon.textContent = isFav ? '♥' : '♡';
    els.favBtn.classList.toggle('active', isFav);
}

/* ==================== API ==================== */
async function geocodeCity(city) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('地理编码服务异常');
    const data = await res.json();
    if (!data.results || !data.results.length) throw new Error(`未找到城市 "${city}"，请检查拼写`);
    return data.results[0];
}

async function reverseGeocode(lat, lon) {
    try {
        const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`;
        const res = await fetch(url);
        const data = await res.json();
        return data.city || data.locality || data.principalSubdivision || '当前位置';
    } catch {
        return '当前位置';
    }
}

async function fetchWeather(lat, lon) {
    const params = new URLSearchParams({
        latitude: lat, longitude: lon,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure',
        hourly: 'temperature_2m,weather_code,visibility',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min',
        timezone: 'auto',
        forecast_days: '8'
    });
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if (!res.ok) throw new Error('天气服务异常');
    return res.json();
}

async function fetchAirQuality(lat, lon) {
    const params = new URLSearchParams({
        latitude: lat, longitude: lon,
        current: 'european_aqi,uv_index',
        timezone: 'auto',
        forecast_days: '1'
    });
    const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${params}`);
    if (!res.ok) return null;
    return res.json();
}

/* ==================== Render ==================== */
function renderCurrent(name, country, current, daily) {
    const info = getWeatherInfo(current.weather_code);
    const now = new Date();
    document.getElementById('cityName').textContent = `${name}${country ? ' · ' + country : ''}`;
    document.getElementById('dateText').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][now.getDay()]}`;
    document.getElementById('tempValue').textContent = Math.round(current.temperature_2m);
    document.getElementById('weatherDesc').textContent = info.label;
    document.getElementById('iconWrap').innerHTML = ICONS[info.icon] || ICONS.cloudy;
    document.getElementById('humidity').textContent = current.relative_humidity_2m + '%';
    document.getElementById('wind').textContent = `${getWindDir(current.wind_direction_10m)} ${getWindLevel(current.wind_speed_10m)}`;
    document.getElementById('feelsLike').textContent = Math.round(current.apparent_temperature) + '°C';
    document.getElementById('updateTime').textContent = formatTime(now);
    if (daily && daily.temperature_2m_max) {
        document.getElementById('tempMax').textContent = Math.round(daily.temperature_2m_max[0]) + '°C';
        document.getElementById('tempMin').textContent = Math.round(daily.temperature_2m_min[0]) + '°C';
    }
    els.weatherCard.classList.add('show');
}

function renderEnv(aqData, hourly, pressure) {
    let aqi = '--', uv = '--', vis = '--', aqiLabel = '--', uvLabel = '--';
    let aqiColor = 'var(--text-main)';

    if (aqData && aqData.current) {
        const aqiVal = aqData.current.european_aqi;
        aqi = Math.round(aqiVal);
        aqiLabel = getAQILabel(aqiVal);
        aqiColor = getAQIColor(aqiVal);
        uv = aqData.current.uv_index;
        uvLabel = getUVLabel(uv);
    }

    if (hourly && hourly.visibility) {
        const now = new Date();
        const isoNow = now.toISOString().slice(0,13);
        let idx = hourly.time.findIndex(t => t.startsWith(isoNow));
        if (idx < 0) idx = now.getHours();
        const v = hourly.visibility[idx];
        if (v != null) vis = (v / 1000).toFixed(1);
    }

    const aqiEl = document.getElementById('aqiValue');
    aqiEl.textContent = aqi;
    aqiEl.style.color = typeof aqi === 'number' ? aqiColor : 'var(--text-main)';
    document.getElementById('aqiLabel').textContent = aqiLabel;
    document.getElementById('uvValue').textContent = uv;
    document.getElementById('uvLabel').textContent = uvLabel;
    document.getElementById('visValue').textContent = vis;
    document.getElementById('pressureValue').textContent = pressure != null ? Math.round(pressure) : '--';
    els.envCard.classList.add('show');
}

function renderHourly(hourly) {
    const now = new Date();
    let startIdx = hourly.time.findIndex(t => new Date(t) >= now);
    if (startIdx < 0) startIdx = now.getHours();
    const temps = hourly.temperature_2m.slice(startIdx, startIdx + 24);
    const times = hourly.time.slice(startIdx, startIdx + 24);
    const codes = hourly.weather_code.slice(startIdx, startIdx + 24);

    // SVG chart
    const minT = Math.min(...temps) - 1;
    const maxT = Math.max(...temps) + 1;
    const range = maxT - minT || 1;
    const W = 640, H = 120, P = 16;

    let points = '';
    let areaPoints = `${P},${H} `;
    temps.forEach((t, i) => {
        const x = P + (i / (temps.length - 1)) * (W - P * 2);
        const y = H - P - ((t - minT) / range) * (H - P * 2);
        points += `${x},${y} `;
        areaPoints += `${x},${y} `;
    });
    areaPoints += `${W - P},${H}`;

    const labels = [];
    for (let i = 0; i < temps.length; i += 3) {
        const x = P + (i / (temps.length - 1)) * (W - P * 2);
        labels.push(`<text x="${x}" y="${H - 2}" text-anchor="middle" font-size="10" fill="var(--text-light)">${formatHour(times[i])}</text>`);
    }

    document.getElementById('hourlyChart').innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <defs>
                <linearGradient id="tempGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <polygon points="${areaPoints}" fill="url(#tempGrad)"/>
            <polyline points="${points}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            ${temps.map((t, i) => {
                const x = P + (i / (temps.length - 1)) * (W - P * 2);
                const y = H - P - ((t - minT) / range) * (H - P * 2);
                return `<circle cx="${x}" cy="${y}" r="3" fill="var(--bg-gradient-start)" stroke="var(--primary)" stroke-width="2"/>
                        <text x="${x}" y="${y - 8}" text-anchor="middle" font-size="11" fill="var(--text-main)" font-weight="600">${Math.round(t)}°</text>`;
            }).join('')}
            ${labels.join('')}
        </svg>
    `;

    // Hourly list
    const list = document.getElementById('hourlyList');
    list.innerHTML = '';
    times.forEach((t, i) => {
        const info = getWeatherInfo(codes[i]);
        const div = document.createElement('div');
        div.className = 'hourly-item';
        div.innerHTML = `
            <div class="hourly-time">${formatHour(t)}</div>
            <div class="hourly-icon">${ICONS[info.icon] || ICONS.cloudy}</div>
            <div class="hourly-temp">${Math.round(temps[i])}°</div>
        `;
        list.appendChild(div);
    });
    els.hourlyCard.classList.add('show');
}

function renderDaily(daily) {
    const list = document.getElementById('dailyList');
    list.innerHTML = '';
    for (let i = 0; i < daily.time.length; i++) {
        const info = getWeatherInfo(daily.weather_code[i]);
        const card = document.createElement('div');
        card.className = 'daily-card';
        card.innerHTML = `
            <div class="daily-date">${i === 0 ? '今天' : formatShortDate(daily.time[i])}</div>
            <div class="daily-icon">${ICONS[info.icon] || ICONS.cloudy}</div>
            <div class="daily-desc">${info.label}</div>
            <div class="daily-temp-high">${Math.round(daily.temperature_2m_max[i])}°</div>
            <div class="daily-temp-low">${Math.round(daily.temperature_2m_min[i])}°</div>
        `;
        list.appendChild(card);
    }
    els.dailyCard.classList.add('show');
}

/* ==================== Search & Locate ==================== */
async function fetchAll(lat, lon, name, country) {
    els.searchBtn.disabled = true;
    showStatus('loading');
    [els.weatherCard, els.envCard, els.hourlyCard, els.dailyCard].forEach(c => c.classList.remove('show'));

    try {
        const [weather, aq] = await Promise.all([
            fetchWeather(lat, lon),
            fetchAirQuality(lat, lon)
        ]);

        currentCity = { name, lat, lon, country };
        localStorage.setItem('lastCity', JSON.stringify(currentCity));
        addToHistory(name);
        updateFavBtn();

        renderCurrent(name, country, weather.current, weather.daily);
        renderEnv(aq, weather.hourly, weather.current.surface_pressure);
        renderHourly(weather.hourly);
        renderDaily(weather.daily);
        hideAllStatus();
    } catch (err) {
        showStatus('error', err.message || '查询失败');
    } finally {
        els.searchBtn.disabled = false;
    }
}

async function handleSearch() {
    const city = els.cityInput.value.trim();
    if (!city) { showStatus('error', '请输入城市名称'); return; }
    if (!navigator.onLine) { showStatus('offline'); return; }

    const geo = await geocodeCity(city);
    await fetchAll(geo.latitude, geo.longitude, geo.name, geo.country);
}

async function handleAutoLocate(isManual = false) {
    if (!isManual && !isAutoLocateEnabled()) {
        return; // 自动定位已关闭，静默跳过
    }
    if (!navigator.geolocation) {
        if (isManual) showStatus('error', '您的设备不支持定位');
        return;
    }
    if (!navigator.onLine) { showStatus('offline'); return; }

    els.locateBtn.disabled = true;
    showStatus('loading');

    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            const { latitude, longitude } = pos.coords;
            const cityName = await reverseGeocode(latitude, longitude);
            await fetchAll(latitude, longitude, cityName, '');
            els.locateBtn.disabled = false;
        },
        (err) => {
            let msg = '定位失败';
            if (err.code === 1) msg = '定位权限被拒绝，请在浏览器设置中开启';
            else if (err.code === 2) msg = '无法获取位置信息';
            else if (err.code === 3) msg = '定位超时';
            if (isManual || isAutoLocateEnabled()) showStatus('error', msg);
            els.locateBtn.disabled = false;
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
    );
}

/* ==================== Swipe ==================== */
els.swipeArea.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

els.swipeArea.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) < 50) return;
    if (!savedCities.length || !currentCity) return;
    const idx = savedCities.findIndex(c => c.name === currentCity.name);
    if (diff > 0 && idx < savedCities.length - 1) loadSavedCity(idx + 1);
    else if (diff < 0 && idx > 0) loadSavedCity(idx - 1);
}, { passive: true });

/* ==================== Init ==================== */
els.cityInput.addEventListener('input', e => {
    const val = e.target.value.trim();
    if (!val) { hideSuggest(); return; }
    renderSuggest(getCityMatches(val));
});

els.cityInput.addEventListener('keydown', e => {
    const box = document.getElementById('searchSuggest');
    if (!box.classList.contains('show')) {
        if (e.key === 'Enter') handleSearch();
        return;
    }
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        suggestActive = Math.min(suggestActive + 1, suggestMatches.length - 1);
        updateSuggestHighlight();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        suggestActive = Math.max(suggestActive - 1, -1);
        updateSuggestHighlight();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (suggestActive >= 0 && suggestMatches[suggestActive]) {
            selectSuggest(suggestMatches[suggestActive].n);
        } else {
            hideSuggest();
            handleSearch();
        }
    } else if (e.key === 'Escape') {
        hideSuggest();
    }
});

window.addEventListener('DOMContentLoaded', () => {
    initLocateSetting();
    loadSavedCities();
    loadHistory();

    const last = localStorage.getItem('lastCity');
    if (last) {
        try {
            const c = JSON.parse(last);
            if (c && c.name) {
                currentCity = c;
                els.cityInput.value = c.name;
                fetchAll(c.lat, c.lon, c.name, c.country);
                return;
            }
        } catch { /* ignore */ }
    }

    // No last city: try auto locate if enabled
    handleAutoLocate(false);
});
</script>

</body>
</html>
